# Tests + test builds.
# - Every push to master: run all tests, build an Android APK and publish it
#   on the "test-build" pre-release (Releases page) to install on a phone.
# - Run manually (Actions → Build → Run workflow) with "ios" ticked to also
#   build an unsigned iOS .ipa (macOS runners use 10x minutes on private repos).
name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ios:
        description: Also build an unsigned iOS .ipa
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Engine tests
        working-directory: packages/numcross_engine
        run: dart pub get && dart test
      - name: App analyze + tests
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "../adadi-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: adadi-*.apk
      - name: Publish on the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Test build from ${GITHUB_SHA::7}. Android: download the .apk on the phone and install it (allow installs from this source). Signed with a debug key, for testing only."
          if ! gh release view test-build >/dev/null 2>&1; then
            gh release create test-build --prerelease --title "Test build" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release edit test-build --notes "$notes"
          fi
          # Keep only the newest APK on the release.
          for a in $(gh release view test-build --json assets --jq '.assets[].name' | grep '\.apk$' || true); do
            gh release delete-asset test-build "$a" -y
          done
          gh release upload test-build adadi-*.apk --clobber

  ios:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build unsigned IPA
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          zip -qr "../adadi-$version-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: adadi-*-unsigned.ipa
      - name: Publish on the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "Test build" --notes "Test builds" --target "$GITHUB_SHA"
          for a in $(gh release view test-build --json assets --jq '.assets[].name' | grep '\.ipa$' || true); do
            gh release delete-asset test-build "$a" -y
          done
          gh release upload test-build adadi-*-unsigned.ipa --clobber
