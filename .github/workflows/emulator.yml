# On an Android 14 emulator with Google Play services (like a real phone):
# 1. smoke: installs and launches the release APK, checks it stays up;
#    the same for the Cafe Bazaar APK at the end;
# 2. flow: full player journey (integration_test/app_flow_test.dart) with a
#    screenshot of every screen.
# Screenshots + logcat are uploaded as the "smoke" artifact.
name: Emulator smoke test

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the emulator needs several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APKs for the emulator (x86_64)
        working-directory: app
        run: |
          flutter pub get
          # Release builds exactly as the stores get them (tool/store_build.sh).
          ../tool/store_build.sh global apk --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk ../adadi-x64.apk
          ../tool/store_build.sh bazaar apk --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk ../adadi-bazaar-x64.apk
          # Journey test app, built now so no Gradle runs next to the emulator.
          flutter build apk --debug --target-platform android-x64 -t integration_test/app_flow_test.dart
          cp build/app/outputs/flutter-apk/app-debug.apk ../adadi-flow-x64.apk
          # Private-repo runners have 2 cores / ~7 GB: free Gradle's memory.
          (cd android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          rm -rf build/app/intermediates build/app/tmp
          df -h /; free -m
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash tool/ci/emulator.sh adadi-x64.apk adadi-bazaar-x64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
