# On an Android 14 emulator with Google Play services (like a real phone):
# 1. smoke: installs and launches the release APK, checks it stays up;
# 2. flow: full player journey (integration_test/app_flow_test.dart) with a
#    screenshot of every screen.
# Screenshots + logcat are uploaded as the "smoke" artifact.
name: Emulator smoke test

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the emulator needs several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build release APK for the emulator (x86_64)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk ../adadi-x64.apk
          rm -rf build/app/intermediates build/app/tmp
          df -h /
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tool/ci/emulator.sh adadi-x64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
